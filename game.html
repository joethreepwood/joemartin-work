<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0812">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Null Sector — a game by Joe Martin</title>
  <meta name="description" content="Null Sector — a small turn-based cyberpunk tactics game. Into the Breach by way of Fallout. Plays in the browser.">

  <meta property="og:title" content="Null Sector">
  <meta property="og:description" content="A small turn-based cyberpunk tactics game. Plays in the browser.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://joemartin.work/game.html">

  <link rel="icon" href="images/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- ?v= is a cache-buster: bump it whenever an asset below changes, so the
       browser fetches the new file instead of a stale cached copy. -->
  <link rel="stylesheet" href="game.css?v=20260728b">
</head>
<body>
  <div class="tac-app" data-app>

    <header class="hud hud--top" data-hud-top>
      <a class="hud__back" href="./" aria-label="Back to joemartin.work">&larr;</a>
      <span class="hud__title">NULL SECTOR</span>
      <div class="hud__right">
        <span class="stat stat--wide"><b data-sector>01</b><i data-sector-name>The Approach</i></span>
        <span class="stat stat--foe"><b data-foes>0</b><i>hostile</i></span>
        <span class="stat stat--threat" data-threat hidden><b>0</b><i>drafted</i></span>
        <button class="hud__help" type="button" data-help aria-label="Field manual">?</button>
      </div>
    </header>

    <div class="stagewrap">
      <canvas id="stage" data-stage aria-label="Tactics grid" role="img"></canvas>
    </div>

    <!-- Contextual readout: weapon stats, to-hit, what the next tap will do.
         A floating panel beside the board on desktop; on a phone it docks as a
         fixed-height sheet in the flex flow, so it reserves its own space and
         the board never jumps or gets covered. -->
    <div class="tip" data-tip hidden></div>

    <footer class="hud hud--bottom" data-hud-bottom>
      <div class="squad" data-squad aria-label="Squad"></div>
      <div class="hud__acts" data-acts></div>
      <button class="btn-end" type="button" data-end disabled>End turn</button>
    </footer>

    <div class="overlay" data-overlay hidden>
      <div class="panel" data-panel></div>
    </div>

    <!-- CRT pass: scanlines + a soft vignette over the whole app. Purely
         decorative, never interactive, and disabled for reduced-motion. -->
    <div class="hitflash" data-flash aria-hidden="true"></div>
    <div class="crt" data-crt aria-hidden="true"></div>

    <span class="sr-only" aria-live="polite" data-live></span>
    <div class="toosmall">Turn your phone upright, or open this on a bigger screen.</div>
  </div>

  <script src="analytics.js?v=20260728b" defer></script>
  <script src="game.js?v=20260728b" defer></script>
</body>
</html>
